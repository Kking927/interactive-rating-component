<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <title>Interactive Rating Component</title>
</head>

<body>

  <main class="container">

    <div class="card rating-state">
      <div class="star-container">
        <img src="https://raw.githubusercontent.com/Kking927/interactive-rating-component/9d7998cdcb386623eb61fb56f259d434f0ef3908/images/icon-star.svg" alt="Star icon">
      </div>

      <div class="text-content">
        <h1 class="title">How did we do?</h1>
        <p class="directions">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      </div>

      <div class="rating-btns">
        <button type="button" class="number-btn">1</button>
        <button type="button" class="number-btn">2</button>
        <button type="button" class="number-btn">3</button>
        <button type="button" class="number-btn">4</button>
        <button type="button" class="number-btn">5</button>
      </div>

      <button class="submit-btn">Submit</button>
    </div>

    <div class="card thank-you-state display-none">
      <img src="https://raw.githubusercontent.com/Kking927/interactive-rating-component/9d7998cdcb386623eb61fb56f259d434f0ef3908/images/illustration-thank-you.svg" alt="Thank you illustration" class="thank-you-img">

      <div class="selection-badge">
        You selected <span id="rating-value">0</span> out of 5
      </div>

      <div class="text-content center-align">
        <h1 class="title">Thank you!</h1>
        <p class="directions">We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
